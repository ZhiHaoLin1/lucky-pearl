name: Check Payment Emails

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Gmail for new Venmo/Zelle payment notifications
        run: |
          curl -sf -X GET "https://www.luckypearl.app/api/cron/check-payment-emails" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
